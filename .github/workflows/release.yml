name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl --bin updog-agent
      - name: Package host agent
        run: |
          install -D -m 0755 target/x86_64-unknown-linux-musl/release/updog-agent release/updog-agent
          tar -C release -czf updog-agent-linux-x86_64.tar.gz updog-agent
          sha256sum updog-agent-linux-x86_64.tar.gz > updog-agent-linux-x86_64.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            updog-agent-linux-x86_64.tar.gz
            updog-agent-linux-x86_64.tar.gz.sha256
