name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl --bin updog-agent
      - name: Verify tag matches binary version
        run: |
          expected_version="updog-agent ${GITHUB_REF_NAME#v}"
          actual_version="$(target/x86_64-unknown-linux-musl/release/updog-agent --version)"
          test "${actual_version}" = "${expected_version}"
      - name: Package host agent
        env:
          RELEASE_SIGNING_KEY_BASE64: ${{ secrets.UPDOG_RELEASE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_SIGNING_KEY_BASE64}"
          signing_key="$(mktemp)"
          trap 'rm -f "${signing_key}"' EXIT
          printf '%s' "${RELEASE_SIGNING_KEY_BASE64}" | base64 --decode >"${signing_key}"
          chmod 0600 "${signing_key}"

          install -m 0755 target/x86_64-unknown-linux-musl/release/updog-agent updog-agent-linux-x86_64
          sha256sum updog-agent-linux-x86_64 > updog-agent-linux-x86_64.sha256
          openssl pkeyutl -sign -rawin -inkey "${signing_key}" \
            -in updog-agent-linux-x86_64.sha256 \
            -out updog-agent-linux-x86_64.sha256.sig

          install -D -m 0755 updog-agent-linux-x86_64 release/updog-agent
          tar -C release -czf updog-agent-linux-x86_64.tar.gz updog-agent
          sha256sum updog-agent-linux-x86_64.tar.gz > updog-agent-linux-x86_64.tar.gz.sha256
          openssl pkeyutl -sign -rawin -inkey "${signing_key}" \
            -in updog-agent-linux-x86_64.tar.gz.sha256 \
            -out updog-agent-linux-x86_64.tar.gz.sha256.sig
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            updog-agent-linux-x86_64
            updog-agent-linux-x86_64.sha256
            updog-agent-linux-x86_64.sha256.sig
            updog-agent-linux-x86_64.tar.gz
            updog-agent-linux-x86_64.tar.gz.sha256
            updog-agent-linux-x86_64.tar.gz.sha256.sig
