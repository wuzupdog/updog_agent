[package]
name = "updog_agent"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Linux host and local StatsD telemetry agent for Updog"
license = "MIT"
repository = "https://github.com/wuzupdog/updog_agent"

[[bin]]
name = "updog-agent"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = true }
libc = "0.2"
ring = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
